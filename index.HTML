<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Menu AI">
    <title>Menu AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; color: #fff; height: 100vh; overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; }
        header { background: #0d0d0d; padding: 16px 20px; border-bottom: 1px solid #1a1a1a; }
        header h1 { font-size: 20px; font-weight: 600; }
        .tabs { display: flex; gap: 8px; margin-top: 12px; }
        .tab { padding: 8px 16px; background: #1a1a1a; border: none; border-radius: 8px; color: #888; font-size: 14px; font-weight: 500; cursor: pointer; }
        .tab.active { background: #fff; color: #000; }
        .content { flex: 1; overflow-y: auto; padding: 16px; }
        .chat-container { display: flex; flex-direction: column; height: 100%; }
        .messages { flex: 1; overflow-y: auto; margin-bottom: 16px; }
        .message { margin-bottom: 16px; padding: 14px 18px; background: #1a1a1a; border-radius: 12px; font-size: 15px; line-height: 1.4; }
        .message.user { background: #2a2a2a; }
        .message.ai { background: #0d47a1; }
        .input-area { display: flex; gap: 8px; }
        .input-area input { flex: 1; padding: 14px 18px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; color: #fff; font-size: 15px; outline: none; }
        .input-area button { padding: 14px 24px; background: #fff; border: none; border-radius: 12px; color: #000; font-size: 15px; font-weight: 600; cursor: pointer; }
        .generate-btn { width: 100%; padding: 16px; background: #fff; border: none; border-radius: 12px; color: #000; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
        .menu-section { margin-bottom: 24px; }
        .menu-section h2 { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
        .day-card { background: #1a1a1a; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .day-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .meal { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2a2a2a; }
        .meal:last-child { border-bottom: none; }
        .meal-name { font-size: 14px; color: #ccc; }
        .meal-macros { font-size: 13px; color: #888; }
        .macros-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-top: 16px; }
        .macro-item { background: #0d0d0d; padding: 14px; border-radius: 10px; text-align: center; }
        .macro-value { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .macro-label { font-size: 12px; color: #888; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Menu AI</h1>
            <div class="tabs">
                <button class="tab active" onclick="showTab('chat')">Chat</button>
                <button class="tab" onclick="showTab('menu')">Menù Settimanale</button>
            </div>
        </header>
        <div class="content">
            <div id="chat-tab" class="chat-container">
                <div class="messages" id="messages">
                    <div class="message ai">Ciao! 👋 Agente AI per pianificazione pasti. Chiedimi genera menù settimanale!</div>
                </div>
                <div class="input-area">
                    <input type="text" id="chatInput" placeholder="Scrivi..." onkeypress="if(event.key==='Enter')sendMessage()">
                    <button onclick="sendMessage()">Invia</button>
                </div>
            </div>
            <div id="menu-tab" class="hidden">
                <button class="generate-btn" onclick="generateMenu()">Genera Menù Settimanale</button>
                <div class="menu-section">
                    <h2>Macros Giornalieri</h2>
                    <div class="macros-grid">
                        <div class="macro-item"><div class="macro-value" id="cal">0</div><div class="macro-label">Calorie</div></div>
                        <div class="macro-item"><div class="macro-value" id="pro">0</div><div class="macro-label">Proteine</div></div>
                        <div class="macro-item"><div class="macro-value" id="car">0</div><div class="macro-label">Carbi</div></div>
                        <div class="macro-item"><div class="macro-value" id="fat">0</div><div class="macro-label">Grassi</div></div>
                    </div>
                </div>
                <div id="menuDays"></div>
            </div>
        </div>
    </div>
    <script>
        function showTab(n) { 
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); 
            document.querySelectorAll('.content > div').forEach(d=>d.classList.add('hidden')); 
            document.getElementById(n+'-tab').classList.remove('hidden'); 
            document.querySelectorAll('.tab')[n=='chat'?0:1].classList.add('active'); 
        }
        function sendMessage() { 
            const i=document.getElementById('chatInput'),m=i.value.trim(); 
            if(!m)return; 
            document.getElementById('messages').innerHTML+=`<div class="message user">${m}</div>`; 
            i.value=''; 
            setTimeout(()=>{ 
                document.getElementById('messages').innerHTML+=`<div class="message ai">Perfetto! Genero menù settimanale. Passa a Menù Settimanale! 🍽️</div>`; 
                generateMenu(); 
                showTab('menu'); 
            },800); 
        }
        function generateMenu() { 
            const days=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica']; 
            const meals={c:['Pizza uova avocado','Porridge avena','Smoothie bowl','Pane uova','Creppe ricotta','French toast','Avocado toast'],p:['Riso tofu','Quinoa pollo','Pasta legumi','Bowl riso','Insalata farro','Wrap tacchino','Sushi bowl'],v:['Pesce verdure','Pollo quinoa','Hamburger tata','Zuppa legumi','Trottola verdure','Bistecca','Sigma pesce']}; 
            let tcal=0,tpro=0,tcar=0,tfat=0,d={}; 
            days.forEach((day,idx)=>{ 
                const c=2000+Math.floor(Math.random()*200),p=Math.floor(c*0.3/4),car=Math.floor(c*0.4/4),f=Math.floor(c*0.3/9); 
                tcal+=c;tpro+=p;tcar+=car;tfat+=f;
                d[day]={c:{n:meals.c[idx%7],c:Math.floor(c*0.25)},p:{n:meals.p[idx%7],c:Math.floor(c*0.35)},v:{n:meals.v[idx%7],c:Math.floor(c*0.4)}}; 
            }); 
            document.getElementById('cal').textContent=Math.floor(tcal/7); 
            document.getElementById('pro').textContent=Math.floor(tpro/7); 
            document.getElementById('car').textContent=Math.floor(tcar/7); 
            document.getElementById('fat').textContent=Math.floor(tfat/7); 
            let html=''; 
            days.forEach(day=>{ 
                html+=`<div class="day-card"><h3>${day}</h3><div class="meal"><span class="meal-name">☀️ ${d[day].c.n}</span><span class="meal-macros">${d[day].c.c} cal</span></div><div class="meal"><span class="meal-name">🌤️ ${d[day].p.n}</span><span class="meal-macros">${d[day].p.c} cal</span></div><div class="meal"><span class="meal-name">🌙 ${d[day].v.n}</span><span class="meal-macros">${d[day].v.c} cal</span></div></div>`; 
            }); 
            document.getElementById('menuDays').innerHTML=html; 
        }
        generateMenu();
    </script>
</body>
</html>
