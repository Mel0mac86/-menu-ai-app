<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Menu AI">
    <title>Menu AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; color: #fff; height: 100vh; }
        .container { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; }
        header { background: #0d0d0d; padding: 16px 20px; border-bottom: 1px solid #1a1a1a; }
        header h1 { font-size: 20px; font-weight: 600; }
        .tabs { display: flex; gap: 8px; margin-top: 12px; }
        .tab { padding: 8px 16px; background: #1a1a1a; border: none; border-radius: 8px; color: #888; font-size: 14px; }
        .tab.active { background: #fff; color: #000; }
        .content { flex: 1; overflow-y: auto; padding: 16px; }
        .messages { margin-bottom: 16px; }
        .message { margin-bottom: 12px; padding: 12px 16px; background: #1a1a1a; border-radius: 10px; font-size: 14px; }
        .message.user { background: #2a2a2a; }
        .message.ai { background: #0d47a1; }
        .input-area { display: flex; gap: 8px; }
        .input-area input { flex: 1; padding: 12px 16px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; color: #fff; font-size: 14px; }
        .input-area button { padding: 12px 20px; background: #fff; border: none; border-radius: 10px; color: #000; font-size: 14px; font-weight: 600; }
        .generate-btn { width: 100%; padding: 14px; background: #fff; border: none; border-radius: 10px; color: #000; font-size: 15px; font-weight: 600; margin-bottom: 16px; }
        .day-card { background: #1a1a1a; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
        .day-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
        .meal { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a2a; }
        .meal:last-child { border-bottom: none; }
        .meal-name { font-size: 13px; color: #ccc; }
        .meal-cal { font-size: 12px; color: #888; }
        .macros-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-top: 12px; }
        .macro-item { background: #0d0d0d; padding: 12px; border-radius: 8px; text-align: center; }
        .macro-value { font-size: 20px; font-weight: 700; color: #fff; }
        .macro-label { font-size: 11px; color: #888; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Menu AI</h1>
            <div class="tabs">
                <button class="tab active" onclick="showTab('chat')">Chat</button>
                <button class="tab" onclick="showTab('menu')">Menù</button>
            </div>
        </header>
        <div class="content">
            <div id="chat-tab">
                <div class="messages" id="messages">
                    <div class="message ai">Ciao! 👋 Chiedimi genera menù settimanale!</div>
                </div>
                <div class="input-area">
                    <input type="text" id="chatInput" placeholder="Scrivi..." onkeypress="if(event.key==='Enter')sendMessage()">
                    <button onclick="sendMessage()">Invia</button>
                </div>
            </div>
            <div id="menu-tab" class="hidden">
                <button class="generate-btn" onclick="generateMenu()">Genera Menù</button>
                <div class="macros-grid">
                    <div class="macro-item"><div class="macro-value" id="cal">0</div><div class="macro-label">Cal</div></div>
                    <div class="macro-item"><div class="macro-value" id="pro">0</div><div class="macro-label">Pro</div></div>
                    <div class="macro-item"><div class="macro-value" id="car">0</div><div class="macro-label">Car</div></div>
                    <div class="macro-item"><div class="macro-value" id="fat">0</div><div class="macro-label">Fat</div></div>
                </div>
                <div id="menuDays"></div>
            </div>
        </div>
    </div>
    <script>
        function showTab(n) { document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.querySelectorAll('#chat-tab,#menu-tab').forEach(d=>d.classList.add('hidden')); document.getElementById(n+'-tab').classList.remove('hidden'); document.querySelectorAll('.tab')[n=='chat'?0:1].classList.add('active'); }
        function sendMessage() { const i=document.getElementById('chatInput'),m=i.value.trim(); if(!m)return; document.getElementById('messages').innerHTML+=`<div class="message user">${m}</div>`; i.value=''; setTimeout(()=>{ document.getElementById('messages').innerHTML+=`<div class="message ai">Perfetto! Genero menù. Vai su Menù! 🍽️</div>`; generateMenu(); showTab('menu'); },800); }
        function generateMenu() { const days=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica']; const meals={c:['Pizza uova','Porridge','Smoothie','Pane uova','Creppe','French toast','Avocado toast'],p:['Riso tofu','Quinoa pollo','Pasta legumi','Bowl riso','Insalata farro','Wrap tacchino','Sushi'],v:['Pesce verdure','Pollo quinoa','Hamburger','Zuppa','Verdure riso','Bistecca','Sigma pesce']}; let tcal=0,tpro=0,tcar=0,tfat=0,d={}; days.forEach((day,idx)=>{ const c=2000+Math.floor(Math.random()*200),p=Math.floor(c*0.3/4),car=Math.floor(c*0.4/4),f=Math.floor(c*0.3/9); tcal+=c;tpro+=p;tcar+=car;tfat+=f;d[day]={c:{n:meals.c[idx%7],c:Math.floor(c*0.25)},p:{n:meals.p[idx%7],c:Math.floor(c*0.35)},v:{n:meals.v[idx%7],c:Math.floor(c*0.4)}}; }); document.getElementById('cal').textContent=Math.floor(tcal/7); document.getElementById('pro').textContent=Math.floor(tpro/7); document.getElementById('car').textContent=Math.floor(tcar/7); document.getElementById('fat').textContent=Math.floor(tfat/7); let html=''; days.forEach(day=>{ html+=`<div class="day-card"><h3>${day}</h3><div class="meal"><span class="meal-name">☀️ ${d[day].c.n}</span><span class="meal-cal">${d[day].c.c}</span></div><div class="meal"><span class="meal-name">🌤️ ${d[day].p.n}</span><span class="meal-cal">${d[day].p.c}</span></div><div class="meal"><span class="meal-name">🌙 ${d[day].v.n}</span><span class="meal-cal">${d[day].v.c}</span></div></div>`; }); document.getElementById('menuDays').innerHTML=html; }
        generateMenu();
    </script>
</body>
</html>
